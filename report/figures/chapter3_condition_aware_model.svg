<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="700" viewBox="0 0 1800 700">
  <defs>
    <style>
      .label { font: 700 17px Arial, sans-serif; fill: #17242a; }
      .small { font: 400 13px Arial, sans-serif; fill: #405159; }
      .tiny { font: 400 11px Arial, sans-serif; fill: #526269; }
      .math { font: italic 15px Georgia, serif; fill: #24343a; }
      .group-title { font: 700 15px Arial, sans-serif; fill: #34464d; }
      .base { fill: #eaf3f7; stroke: #657b84; stroke-width: 1.8; }
      .added { fill: #fff3e6; stroke: #df6a25; stroke-width: 2; }
      .output { fill: #edf7f1; stroke: #33835e; stroke-width: 1.8; }
      .neutral { fill: #ffffff; stroke: #74878e; stroke-width: 1.7; }
      .arrow { fill: none; stroke: #52686f; stroke-width: 2; marker-end: url(#arrow); }
      .aux { fill: none; stroke: #df6a25; stroke-width: 1.8; stroke-dasharray: 7 5; marker-end: url(#arrowOrange); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#52686f"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#df6a25"/>
    </marker>
  </defs>

  <rect width="1800" height="700" fill="#ffffff"/>

  <!-- Legend -->
  <rect x="38" y="28" width="22" height="15" rx="2" class="base"/>
  <text x="70" y="41" class="small">MTAD-GAT backbone</text>
  <rect x="225" y="28" width="22" height="15" rx="2" class="added"/>
  <text x="257" y="41" class="small">Chapter 3 additions</text>
  <line x1="430" y1="36" x2="476" y2="36" class="arrow"/>
  <text x="488" y="41" class="small">forward flow</text>
  <line x1="590" y1="36" x2="636" y2="36" class="aux"/>
  <text x="648" y="41" class="small">auxiliary supervision</text>

  <!-- Input -->
  <rect x="35" y="225" width="150" height="130" rx="7" class="neutral"/>
  <text x="110" y="251" text-anchor="middle" class="label">Input Data</text>
  <g transform="translate(57 267)">
    <path d="M0 13 C14 0 26 27 40 12 S66 1 80 16 S104 22 118 8" fill="none" stroke="#3ca0c8" stroke-width="2"/>
    <path d="M0 37 C15 24 28 49 43 35 S72 23 88 39 S105 43 118 30" fill="none" stroke="#e77b2d" stroke-width="2"/>
    <path d="M0 61 C14 53 27 68 41 59 S70 48 86 62 S106 64 118 54" fill="none" stroke="#3f9b6b" stroke-width="2"/>
  </g>
  <text x="110" y="342" text-anchor="middle" class="math">X ∈ R^(L×D)</text>

  <!-- Preprocessing and convolution -->
  <rect x="225" y="240" width="120" height="100" rx="7" class="base"/>
  <text x="285" y="279" text-anchor="middle" class="label">Scaling</text>
  <text x="285" y="305" text-anchor="middle" class="small">train only</text>
  <rect x="390" y="240" width="135" height="100" rx="7" class="base"/>
  <text x="458" y="278" text-anchor="middle" class="label">1-D Conv</text>
  <text x="458" y="304" text-anchor="middle" class="small">local features</text>
  <path d="M185 290 H225" class="arrow"/>
  <path d="M345 290 H390" class="arrow"/>

  <!-- Parallel graph attention -->
  <rect x="600" y="150" width="200" height="95" rx="7" class="base"/>
  <text x="700" y="185" text-anchor="middle" class="label">Feature GATv2</text>
  <text x="700" y="211" text-anchor="middle" class="small">relations among variables</text>
  <rect x="600" y="335" width="200" height="95" rx="7" class="base"/>
  <text x="700" y="370" text-anchor="middle" class="label">Temporal GATv2</text>
  <text x="700" y="396" text-anchor="middle" class="small">relations among timestamps</text>
  <path d="M525 290 C560 290 561 197 600 197" class="arrow"/>
  <path d="M525 290 C560 290 561 382 600 382" class="arrow"/>

  <!-- Concatenation -->
  <rect x="865" y="240" width="130" height="100" rx="7" class="base"/>
  <text x="930" y="270" text-anchor="middle" class="label">Fusion + FiLM</text>
  <text x="930" y="296" text-anchor="middle" class="math">H_rel=[X,H_f,H_t]</text>
  <text x="930" y="320" text-anchor="middle" class="tiny">H'=(1+γ(z))⊙H_rel+β(z)</text>
  <path d="M525 290 H865" class="arrow"/>
  <path d="M800 197 C835 197 835 265 865 273" class="arrow"/>
  <path d="M800 382 C835 382 835 315 865 307" class="arrow"/>

  <!-- Conditioned GRU and Transformer representation -->
  <text x="1165" y="106" text-anchor="middle" class="group-title">Conditioned sequence representation</text>
  <rect x="1080" y="150" width="170" height="95" rx="7" class="base"/>
  <text x="1165" y="185" text-anchor="middle" class="label">GRU</text>
  <text x="1165" y="211" text-anchor="middle" class="math">h_GRU</text>
  <rect x="1080" y="335" width="170" height="95" rx="7" class="added"/>
  <text x="1165" y="370" text-anchor="middle" class="label">Transformer</text>
  <text x="1165" y="396" text-anchor="middle" class="math">h_TR</text>
  <circle cx="1438" cy="245" r="29" fill="#ffffff" stroke="#687c83" stroke-width="1.8"/>
  <text x="1438" y="253" text-anchor="middle" style="font:700 27px Georgia;fill:#26373d">+</text>
  <text x="1438" y="294" text-anchor="middle" class="math">h</text>
  <path d="M995 275 C1025 270 1032 197 1080 197" class="arrow"/>
  <path d="M995 305 C1025 310 1032 382 1080 382" class="arrow"/>
  <path d="M1250 197 C1320 197 1365 220 1410 238" class="arrow"/>
  <path d="M1250 382 C1350 382 1410 315 1431 273" class="arrow"/>

  <!-- Dynamic-state branch -->
  <rect x="600" y="505" width="410" height="105" rx="7" class="added"/>
  <text x="805" y="535" text-anchor="middle" class="label">Dynamic-state encoder</text>
  <text x="805" y="562" text-anchor="middle" class="small">selected context C → temporal Conv → attention pooling</text>
  <text x="805" y="590" text-anchor="middle" class="math">z_d ∈ R^32</text>
  <path d="M110 355 V557 H600" class="arrow"/>
  <path d="M1010 557 H1035 V455 H930 V340" class="arrow"/>
  <path d="M805 610 V640" class="aux"/>
  <text x="805" y="667" text-anchor="middle" class="math">L_desc</text>

  <!-- Dual task heads and score -->
  <rect x="1490" y="155" width="140" height="85" rx="7" class="base"/>
  <text x="1560" y="188" text-anchor="middle" class="label">Forecast</text>
  <text x="1560" y="214" text-anchor="middle" class="math">x̂_(t+1)</text>
  <rect x="1490" y="335" width="140" height="85" rx="7" class="base"/>
  <text x="1560" y="368" text-anchor="middle" class="label">Reconstruct</text>
  <text x="1560" y="394" text-anchor="middle" class="math">X̂</text>
  <rect x="1645" y="240" width="140" height="120" rx="7" class="output"/>
  <text x="1715" y="274" text-anchor="middle" class="label">Quality-aware</text>
  <text x="1715" y="296" text-anchor="middle" class="label">score fusion</text>
  <text x="1715" y="324" text-anchor="middle" class="small">e_pred + e_rec</text>
  <text x="1715" y="348" text-anchor="middle" class="math">S_3(t)</text>
  <path d="M1467 237 C1477 230 1480 207 1490 201" class="arrow"/>
  <path d="M1460 263 C1478 285 1478 365 1490 377" class="arrow"/>
  <path d="M1630 197 C1640 197 1638 270 1645 280" class="arrow"/>
  <path d="M1630 377 C1640 377 1638 330 1645 320" class="arrow"/>
</svg>
