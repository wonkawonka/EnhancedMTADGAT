<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
 <defs>
  <marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1558c0"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#148437"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d52b1e"/></marker>
  <style>.title{font:700 42px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#071b55}.sub{font:500 25px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#14235b}.section{font:700 25px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif}.bt{font:700 24px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#071b55}.tx{font:500 19px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#17213e}.sm{font:500 16px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#17213e}.ma{font:italic 22px Georgia,serif;fill:#071b55}.note{font:600 17px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#148437}</style>
 </defs>
 <rect width="1800" height="1200" fill="#fff"/>
 <text x="900" y="65" text-anchor="middle" class="title">C4：独立控制量—响应量物理一致性分支</text>
 <text x="900" y="103" text-anchor="middle" class="sub">不改动 MTAD-GAT 主干｜控制条件下的响应一致性作为独立异常证据</text>

 <text x="250" y="180" class="section" fill="#148437">独立控制—响应一致性支路</text>
 <rect x="280" y="205" width="280" height="135" rx="15" fill="#f2fbf4" stroke="#148437" stroke-width="3"/>
 <text x="420" y="252" text-anchor="middle" class="bt">控制轨迹状态编码</text><text x="420" y="287" text-anchor="middle" class="tx">[I, SOC] → BiGRU → z</text><text x="420" y="316" text-anchor="middle" class="sm">16-D 信息瓶颈（VAE）</text>
 <path d="M560 273 H655" stroke="#148437" stroke-width="4" fill="none" marker-end="url(#green)"/>
 <rect x="660" y="185" width="375" height="175" rx="15" fill="#f2fbf4" stroke="#148437" stroke-width="3"/>
 <text x="847" y="232" text-anchor="middle" class="bt">受控制量驱动的响应解码</text><text x="847" y="270" text-anchor="middle" class="sm">逐时刻输入：I, SOC, I², ΔI, ΔSOC</text><text x="847" y="303" text-anchor="middle" class="tx">以 z 初始化 GRU，预测 Ŷresp</text><text x="847" y="333" text-anchor="middle" class="sm">全程不读取电压/温度响应轨迹</text>
 <path d="M1035 273 H1135" stroke="#148437" stroke-width="4" fill="none" marker-end="url(#green)"/>
 <rect x="1140" y="205" width="295" height="135" rx="15" fill="#f2fbf4" stroke="#148437" stroke-width="3"/>
 <text x="1287" y="252" text-anchor="middle" class="bt">一致性残差</text><text x="1287" y="290" text-anchor="middle" class="ma">Sphys = mean |Yresp − Ŷresp|</text><text x="1287" y="317" text-anchor="middle" class="sm">五个响应通道 [0,3,4,5,6]</text>

 <text x="250" y="475" class="section" fill="#1558c0">原始 MTAD-GAT 主干</text>
 <rect x="55" y="575" width="230" height="130" rx="15" fill="#fbfcff" stroke="#071b55" stroke-width="3"/>
 <text x="170" y="625" text-anchor="middle" class="bt">输入窗口 X</text><text x="170" y="662" text-anchor="middle" class="sm">batch × time × variables</text>
 <path d="M285 640 H360" stroke="#1558c0" stroke-width="4" fill="none" marker-end="url(#blue)"/>
 <rect x="365" y="535" width="390" height="210" rx="15" fill="#f4f8ff" stroke="#1558c0" stroke-width="3"/>
 <text x="560" y="583" text-anchor="middle" class="bt">共享主干表征学习</text><text x="560" y="622" text-anchor="middle" class="tx">Conv1D → Feature-GAT / Temporal-GAT</text><text x="560" y="660" text-anchor="middle" class="tx">三路融合 → GRU</text><text x="560" y="700" text-anchor="middle" class="sm">C4 不向该表示注入物理特征</text>
 <path d="M755 640 H825" stroke="#1558c0" stroke-width="4" fill="none" marker-end="url(#blue)"/>
 <rect x="830" y="550" width="215" height="180" rx="15" fill="#f4f8ff" stroke="#1558c0" stroke-width="3"/>
 <text x="937" y="600" text-anchor="middle" class="bt">预测与重构</text><text x="937" y="640" text-anchor="middle" class="tx">下一点预测</text><text x="937" y="674" text-anchor="middle" class="tx">窗口重构</text><text x="937" y="706" text-anchor="middle" class="sm">主干残差</text>
 <path d="M1045 640 H1110" stroke="#1558c0" stroke-width="4" fill="none" marker-end="url(#blue)"/>
 <rect x="1115" y="575" width="210" height="130" rx="15" fill="#f4f8ff" stroke="#1558c0" stroke-width="3"/>
 <text x="1220" y="625" text-anchor="middle" class="bt">数值异常分数</text><text x="1220" y="665" text-anchor="middle" class="ma">Sbase</text>

 <path d="M170 575 V400 H420 V340" stroke="#148437" stroke-width="4" stroke-dasharray="12 10" fill="none" marker-end="url(#green)"/><text x="215" y="430" class="note">仅提取 I、SOC</text>
 <text x="250" y="835" class="section" fill="#d52b1e">训练与推理汇总</text>
 <path d="M1287 340 V885 H1380" stroke="#d52b1e" stroke-width="4" fill="none" marker-end="url(#red)"/>
 <path d="M1220 705 V830 H1380" stroke="#1558c0" stroke-width="4" fill="none" marker-end="url(#blue)"/>
 <rect x="1385" y="790" width="330" height="185" rx="16" fill="#fff6f5" stroke="#d52b1e" stroke-width="3"/>
 <text x="1550" y="840" text-anchor="middle" class="bt">正常数据校准与分数融合</text><text x="1550" y="878" text-anchor="middle" class="sm">中位数 + MAD 对齐两路尺度</text><text x="1550" y="918" text-anchor="middle" class="ma">S = (1−w)Sbase + w Sphys′</text><text x="1550" y="950" text-anchor="middle" class="sm">w ≤ 0.35，不读取测试标签</text>
 <rect x="235" y="975" width="1020" height="125" rx="16" fill="#fbfcff" stroke="#071b55" stroke-width="3"/>
 <text x="745" y="1023" text-anchor="middle" class="bt">训练目标</text><text x="745" y="1064" text-anchor="middle" class="ma">L = Lforecast + Lreconstruction + λc [SmoothL1(Ŷresp, Yresp) + λKL LKL]</text>
 <rect x="70" y="1130" width="1660" height="45" rx="10" fill="#f4f8ff"/><text x="900" y="1160" text-anchor="middle" class="sm">C4 仅用于具有明确电流/SOC 控制语义与可测响应通道的清华 EV 数据；它与 C3 是平行路线，不能同时开启。</text>
</svg>
