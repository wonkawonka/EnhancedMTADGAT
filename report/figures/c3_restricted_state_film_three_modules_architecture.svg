<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#1558c0"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#148437"/></marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#e57616"/></marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#d52b1e"/></marker>
    <style>
      .title{font:700 42px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#071b55}.subtitle{font:500 25px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#14235b}.section{font:700 25px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif}.boxTitle{font:700 23px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#071b55}.txt{font:500 19px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#17213e}.small{font:500 16px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#17213e}.math{font:italic 23px Georgia,serif;fill:#071b55}.note{font:500 17px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#148437}.legend{font:500 18px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#17213e}
    </style>
  </defs>
  <rect width="1800" height="1200" fill="#ffffff"/>
  <text x="900" y="65" text-anchor="middle" class="title">C3：受约束状态 FiLM 三模块架构</text>
  <text x="900" y="103" text-anchor="middle" class="subtitle">状态编码 → 融合层条件调制 → 状态语义辅助约束</text>

  <text x="83" y="175" class="section" fill="#148437">模块 1｜数据驱动工况编码</text>
  <rect x="70" y="195" width="330" height="205" rx="15" fill="#f2fbf4" stroke="#148437" stroke-width="3"/>
  <text x="235" y="238" text-anchor="middle" class="boxTitle">工况输入窗口</text>
  <text x="235" y="274" text-anchor="middle" class="txt">清华：完整七通道窗口</text>
  <text x="235" y="306" text-anchor="middle" class="txt">MSL/SMAP：非目标上下文</text>
  <text x="235" y="348" text-anchor="middle" class="small">以窗口边际统计形成通用模式</text>
  <text x="235" y="375" text-anchor="middle" class="small">不使用显式物理先验</text>
  <path d="M400 298 H470" stroke="#148437" stroke-width="4" fill="none" marker-end="url(#greenArrow)"/>
  <rect x="475" y="195" width="375" height="205" rx="15" fill="#f2fbf4" stroke="#148437" stroke-width="3"/>
  <text x="662" y="238" text-anchor="middle" class="boxTitle">RestrictedStateEncoder</text>
  <text x="662" y="278" text-anchor="middle" class="txt">窗口边际统计描述量</text>
  <text x="662" y="313" text-anchor="middle" class="small">均值 · 标准差 · 首尾变化</text>
  <text x="662" y="341" text-anchor="middle" class="small">平均绝对一阶差分</text>
  <text x="662" y="375" text-anchor="middle" class="math">z = fθ(d) ∈ R⁸</text>

  <text x="83" y="500" class="section" fill="#1558c0">原始 MTAD-GAT 共享主干</text>
  <rect x="70" y="535" width="210" height="122" rx="14" fill="#fbfcff" stroke="#071b55" stroke-width="3"/>
  <text x="175" y="580" text-anchor="middle" class="boxTitle">输入窗口 X</text>
  <text x="175" y="616" text-anchor="middle" class="small">batch × time × variables</text>
  <path d="M280 596 H345" stroke="#1558c0" stroke-width="4" fill="none" marker-end="url(#blueArrow)"/>
  <rect x="350" y="535" width="170" height="122" rx="14" fill="#f4f8ff" stroke="#1558c0" stroke-width="3"/>
  <text x="435" y="584" text-anchor="middle" class="boxTitle">局部卷积</text><text x="435" y="617" text-anchor="middle" class="txt">Conv1D</text>
  <path d="M520 570 H590" stroke="#1558c0" stroke-width="4" fill="none" marker-end="url(#blueArrow)"/>
  <path d="M520 622 H590" stroke="#1558c0" stroke-width="4" fill="none" marker-end="url(#blueArrow)"/>
  <rect x="595" y="510" width="200" height="88" rx="14" fill="#f4f8ff" stroke="#1558c0" stroke-width="3"/><text x="695" y="565" text-anchor="middle" class="boxTitle">Feature-GAT</text>
  <rect x="595" y="620" width="200" height="88" rx="14" fill="#f4f8ff" stroke="#1558c0" stroke-width="3"/><text x="695" y="675" text-anchor="middle" class="boxTitle">Temporal-GAT</text>
  <path d="M795 554 H870 V642 H930" stroke="#1558c0" stroke-width="4" fill="none" marker-end="url(#blueArrow)"/>
  <path d="M795 664 H870 V642" stroke="#1558c0" stroke-width="4" fill="none"/>
  <path d="M520 596 H930" stroke="#1558c0" stroke-width="4" fill="none" marker-end="url(#blueArrow)"/>
  <rect x="935" y="564" width="250" height="156" rx="15" fill="#f4f8ff" stroke="#1558c0" stroke-width="3"/>
  <text x="1060" y="610" text-anchor="middle" class="boxTitle">三路特征融合</text>
  <text x="1060" y="648" text-anchor="middle" class="math">H = [Hconv, Hfeat, Htemp]</text>
  <text x="1060" y="685" text-anchor="middle" class="small">保留原主干的局部、变量与时间信息</text>

  <text x="1230" y="500" class="section" fill="#148437">模块 2｜融合层 FiLM 条件调制</text>
  <path d="M850 297 H1240 V556" stroke="#148437" stroke-width="4" stroke-dasharray="12 10" fill="none" marker-end="url(#greenArrow)"/>
  <text x="1010" y="282" class="note">状态条件 z</text>
  <path d="M1185 642 H1235" stroke="#1558c0" stroke-width="4" fill="none" marker-end="url(#blueArrow)"/>
  <rect x="1240" y="530" width="285" height="220" rx="16" fill="#f2fbf4" stroke="#148437" stroke-width="3"/>
  <text x="1382" y="577" text-anchor="middle" class="boxTitle">Fusion-FiLM(z)</text>
  <text x="1382" y="615" text-anchor="middle" class="small">由状态产生逐维 γ(z)、β(z)</text>
  <text x="1382" y="660" text-anchor="middle" class="math">H̃ = (1 + αγ) ⊙ H + αβ</text>
  <text x="1382" y="705" text-anchor="middle" class="small">仅调制融合表示；初始为恒等映射</text>
  <text x="1382" y="730" text-anchor="middle" class="small">幅度受 regime_film_scale 限制</text>
  <path d="M1525 642 H1580" stroke="#1558c0" stroke-width="4" fill="none" marker-end="url(#blueArrow)"/>
  <rect x="1585" y="574" width="130" height="136" rx="14" fill="#f4f8ff" stroke="#1558c0" stroke-width="3"/><text x="1650" y="650" text-anchor="middle" class="boxTitle">GRU</text>
  <path d="M1650 710 V790" stroke="#1558c0" stroke-width="4" fill="none" marker-end="url(#blueArrow)"/>
  <rect x="1450" y="800" width="200" height="76" rx="13" fill="#fbfcff" stroke="#1558c0" stroke-width="3"/><text x="1550" y="848" text-anchor="middle" class="boxTitle">下一点预测</text>
  <rect x="1450" y="900" width="200" height="76" rx="13" fill="#fbfcff" stroke="#1558c0" stroke-width="3"/><text x="1550" y="948" text-anchor="middle" class="boxTitle">窗口重构</text>
  <path d="M1650 790 H1550 V800" stroke="#1558c0" stroke-width="4" fill="none" marker-end="url(#blueArrow)"/>
  <path d="M1650 790 H1550 V900" stroke="#1558c0" stroke-width="4" fill="none" marker-end="url(#blueArrow)"/>

  <text x="83" y="815" class="section" fill="#e57616">模块 3｜状态语义辅助约束（仅训练时）</text>
  <path d="M662 400 V850" stroke="#e57616" stroke-width="4" stroke-dasharray="10 8" fill="none" marker-end="url(#orangeArrow)"/>
  <rect x="475" y="860" width="375" height="118" rx="15" fill="#fff7ee" stroke="#e57616" stroke-width="3"/>
  <text x="662" y="904" text-anchor="middle" class="boxTitle">状态描述量重建头</text>
  <text x="662" y="940" text-anchor="middle" class="math">d̂ = qψ(z)</text>
  <text x="662" y="965" text-anchor="middle" class="small">重建均值、波动、趋势与变化速率</text>
  <path d="M850 919 H930" stroke="#e57616" stroke-width="4" fill="none" marker-end="url(#orangeArrow)"/>
  <rect x="935" y="850" width="325" height="138" rx="15" fill="#fff7ee" stroke="#e57616" stroke-width="3"/>
  <text x="1098" y="895" text-anchor="middle" class="boxTitle">Smooth-L1 状态语义损失</text>
  <text x="1098" y="934" text-anchor="middle" class="math">Lstate = SmoothL1(d̂, d)</text>
  <text x="1098" y="966" text-anchor="middle" class="small">防止 z 成为无语义的训练捷径</text>

  <rect x="70" y="1045" width="1660" height="95" rx="16" fill="#fbfcff" stroke="#071b55" stroke-width="3"/>
  <text x="130" y="1085" class="boxTitle">训练目标</text>
  <text x="900" y="1090" text-anchor="middle" class="math">L = Lforecast + Lreconstruction + λstate Lstate</text>
  <text x="900" y="1122" text-anchor="middle" class="small">推理阶段沿用预测与重构残差评分；状态辅助分支不额外产生异常分数</text>
  <path d="M1650 976 V1038" stroke="#d52b1e" stroke-width="4" fill="none" marker-end="url(#redArrow)"/>
  <text x="1680" y="1018" class="small" fill="#d52b1e">预测/重构残差</text>
</svg>
